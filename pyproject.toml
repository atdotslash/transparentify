[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transparentify"
version = "0.1.0"
description = "Editor de fondo transparente por color y pincel con precisión de píxeles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "atdotslash" }
]
dependencies = [
    "customtkinter>=6.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
